name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # ubuntu-latest (26.04) has no Python 3.9 builds; 24.04 does
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false  # always report both versions
      matrix:
        # 3.9 = local development environment; 3.14 = Streamlit Community Cloud (newer pandas/numpy too)
        python-version: ["3.9", "3.14"]
    name: tests (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # data/processed is committed, so this includes the full-app smoke test
      - name: Run tests
        run: pytest -v
